name: Audit astronomy source metadata
on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *" # UTC, offset from NASA's 06:17 UTC import

permissions:
  contents: write

concurrency:
  group: astronomy-source-audit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify catalog IDs and timestamp schema
        run: python scripts/check_sources.py --self-test
      - name: Probe every listed provider without ingesting source catalog contents
        run: python scripts/check_sources.py
      - name: Commit independently tracked check timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-refresh-status.json
          if git diff --cached --quiet; then
            echo "No source status changes"
          else
            git commit -m "data: audit source endpoint timestamps independently"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
