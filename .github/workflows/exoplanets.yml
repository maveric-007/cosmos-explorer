name: Refresh confirmed exoplanet systems

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # daily source check, UTC
  push:
    paths:
      - "scripts/sync_exoplanets.py"
      - ".github/workflows/exoplanets.yml"

permissions:
  contents: write

concurrency:
  group: exoplanet-ingest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ingestion invariants offline
        run: python scripts/sync_exoplanets.py --self-test
      - name: Fetch and validate COMPLETE NASA confirmed exoplanet composite
        run: python scripts/sync_exoplanets.py
      - name: Verify output counts and file sizes
        run: |
          python - <<'PY'
          import json, os
          with open("data/exoplanet-systems.json", encoding="utf8") as f:
              d=json.load(f)
          with open("data/exoplanet-sync-status.json", encoding="utf8") as f:
              s=json.load(f)
          assert d["schema"]=="cosmos-explorer-exoplanets-v1"
          assert d["counts"]["confirmed_planets"] >= 4000
          assert d["counts"]["host_systems"] >= 1000
          assert len({x["name"] for x in d["systems"]})==len(d["systems"])
          assert os.path.getsize("data/exoplanet-systems.json") < 15000000
          assert s["normalized_sha256"]
          print(d["counts"], s["check_status"], s["last_checked_utc"])
          PY
      - name: Commit latest validated catalogue and audit timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exoplanet-systems.json data/exoplanet-sync-status.json
          if git diff --cached --quiet; then
            echo "No files changed"
          else
            git commit -m "data: synchronize validated NASA confirmed exoplanets and refresh audit"
            git push origin HEAD:main
          fi
