name: Import bounded NEOWISE V2 diameter and albedo properties
on:
  workflow_dispatch:
  schedule:
    - cron: "19 10 * * 0"
  push:
    paths:
      - "scripts/sync_neowise.py"
      - ".github/workflows/neowise.yml"
permissions:
  contents: write
concurrency:
  group: neowise-v2-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test physical measurement invariants
        run: python scripts/sync_neowise.py --self-test
      - name: Fetch and validate bounded IRSA NEOWISE V2 data
        run: python scripts/sync_neowise.py
      - name: Validate provenance and prevent fake mass values
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("data/neowise-sample.json")
          d=json.loads(p.read_text())
          s=json.loads(pathlib.Path("data/neowise-sync-status.json").read_text())
          assert d["schema"]=="cosmos-explorer-neowise-properties-sample-v1"
          assert d["source_id"]=="neowise" and d["sample_only"]
          assert 20<=d["row_count"]<=200
          assert len(d["records"])==d["row_count"]
          assert len({r["source_row_id"] for r in d["records"]})==d["row_count"]
          assert p.stat().st_size < 175000
          assert all("mass" not in k for r in d["records"] for k in r)
          assert s["normalized_sha256"] and s["last_imported_utc"]
          PY
      - name: Commit tested published physical-property sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/neowise-sample.json data/neowise-sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: ingest validated bounded NEOWISE physical properties"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
