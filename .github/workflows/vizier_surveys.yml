name: Import GALAH DR4 and APOGEE DR17 bounded VizieR catalog rows
on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 0"
  push:
    paths:
      - "scripts/sync_vizier_surveys.py"
      - ".github/workflows/vizier_surveys.yml"
permissions:
  contents: write
concurrency:
  group: vizier-survey-import
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline schema, source ID, duplicate, and checksum tests
        run: python scripts/sync_vizier_surveys.py --self-test
      - name: GALAH DR4 derived catalog before APOGEE DR17
        run: python scripts/sync_vizier_surveys.py --source galah_dr4
      - name: APOGEE DR17 allStar source catalog
        run: python scripts/sync_vizier_surveys.py --source apogee_dr17
      - name: Validate two committed source schemas and size limits
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("galah_dr4", "apogee_dr17"):
              p=Path("data/"+name+"-sample.json")
              d=json.loads(p.read_text(encoding="utf8"))
              audit=json.loads(Path("data/"+name+"-sync-status.json").read_text(encoding="utf8"))
              assert d["schema"]=="cosmos-explorer-vizier-survey-sample-v1"
              assert 10<=d["counts"]["sample_rows"]<=200
              assert p.stat().st_size<200000
              assert len({r["source_row_id"] for r in d["records"]})==d["counts"]["sample_rows"]
              assert audit["normalized_sha256"] and audit["last_imported_utc"]
              print(name,d["counts"])
          PY
      - name: Commit only validated lightweight products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/galah_dr4-sample.json data/galah_dr4-sync-status.json data/apogee_dr17-sample.json data/apogee_dr17-sync-status.json
          if git diff --cached --quiet; then
            echo "No changed source snapshots"
          else
            git commit -m "data: synchronize bounded GALAH and APOGEE validated samples"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
