name: Galactic epoch and orbital model regressions
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "scripts/galactic-kinematics.mjs"
      - "scripts/test_galactic_persistence.mjs"
      - ".github/workflows/galactic-persistence.yml"
permissions:
  contents: read
jobs:
  numeric-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Galactic reference-frame math
        run: node scripts/test_galactic_persistence.mjs
      - name: Syntax-check imported module and app script
        run: |
          node --check scripts/galactic-kinematics.mjs
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          start = '<script type="module">'
          end = '</script>'
          assert start in html, 'main module tag missing'
          Path('/tmp/cosmos-main.mjs').write_text(html.split(start, 1)[1].split(end, 1)[0])
          PY
          node --check /tmp/cosmos-main.mjs
